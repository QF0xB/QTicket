openapi: 3.1.0
info:
  title: QTicket User API
  description: User management
  version: 1.0.0
servers:
  - url: /api/v1/users

paths:
  /me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      tags: [ User ]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /authenticate:
    get:
      summary: Internal authentication method
      operationId: authenticate
      tags: [ User ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: './error.yaml#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: './error.yaml#/components/schemas/ProblemDetail'

  /search:
    get:
      summary: Search users
      operationId: searchUsers
      tags: [ User ]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: Search query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: './error.yaml#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: './error.yaml#/components/schemas/ProblemDetail'

components:
  schemas:
    UserInfo:
      type: object
      required: [ id, email, username, firstName, lastName ]
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          description: Email address
        username:
          type: string
          description: Username
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        status:
          $ref: '#/components/schemas/UserStatusInfo'
        audit:
          $ref: '#/components/schemas/UserAuditInfo'

    UserAuditInfo:
      type: object
      required: [ createdAt, createdBy, updatedAt, updatedBy ]
      properties:
        createdAt:
          type: string
          format: date-time
          description: Creation date
        createdBy:
          type: string
          description: Creator user ID
        updatedAt:
          type: string
          format: date-time
          description: Last update date
        updatedBy:
          type: string
          description: Last updater user ID

    UserStatusInfo:
      type: object
      required: [ enabled, emailVerified, expired, locked ]
      properties:
        enabled:
          type: boolean
          description: User enabled status
        emailVerified:
          type: boolean
          description: User email verified status
        locked:
          type: boolean
          description: User locked status
        lockedAt:
          type: string
          format: date-time
          description: User locked date
        lockedBy:
          type: string
          description: User locked by user ID
        expired:
          type: boolean
          description: User expired status
        expiredAt:
          type: string
          format: date-time
          description: User expired date

    AuthenticationRequest:
      type: object
      required: [ login, password ]
      properties:
        login: 
          type: string
          description: Login
        password:
          type: string
          description: Password
          format: password

    AuthenticationResponse:
      type: object
      required: [ user, roles, permissions ]
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        roles: 
          type: array
          description: User roles
          items:
            type: string
        permissions:
          type: array
          description: User permissions
          items:
            type: string
      