server:
  port: 8101

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    jpa:
      hibernate:
        ddl-auto: update
      database-platform: org.hibernate.dialect.H2Dialect
    h2:
      console:
        enabled: true
        path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


