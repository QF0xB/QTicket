[versions]
java = "25"

springBoot = "4.0.3"
springDependencyManagement = "1.1.7"
openapiGenerator = "7.19.0"
springCloud = "2025.1.0"

junit = "6.0.0"
assertj = "3.27.7"
mockito = "5.21.0"
testcontainers = "1.21.3"

spotless = "8.2.1"
dependencyAnalysis = "3.5.1"

lombok = "1.18.44"
mapstruct = "1.6.3"

[libraries]
# Spring starters
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }

# Aop
spring-aop = { module = "org.springframework:spring-aop" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver"}

# Persistence
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
mysql = { module = "com.mysql:mysql-connector-j" }
h2 = { module = "com.h2database:h2" }
h2-console = { module = "org.springframework.boot:spring-boot-h2console" }

# Spring Cloud
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-cloud-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }

# Cache (Valkey via Redis protocol)
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
lettuce = { module = "io.lettuce:lettuce-core" }

# OpenTelemetry
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }

# OpenAPI annotations (optional)
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version = "2.2.30" }

# Development additionals
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
openapiGenerator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dependencyAnalysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }